l_simp_chinese:
 je_italian_unification:0 "意大利统一"
 je_italian_unification_reason:0 "[ROOT.GetCountry.GetName]的民族意识已经觉醒。随着民族主义思潮在亚平宁半岛上的传播，萨丁-皮埃蒙特王国肩负着统一意大利的历史使命。"
 italian_unification.1.t: "意大利统一"
 italian_unification.1.d: "经过漫长的斗争与外交斡旋，亚平宁半岛上分裂的诸邦终于在统一的旗帜下团结起来。一个崭新的意大利王国正式宣告成立，罗马将成为这个新国家的首都。"
 italian_unification.1.f: "意大利统一完成"
 italian_unification.1.a: "意大利万岁！"
 italian_unification.1.b: "人民的意大利！"
 annex_north_italy_button: "整合北意诸邦"
 annex_north_italy_button_desc: "向对我国抱有善意的北意大利诸邦发出统一号召，通过外交手段将它们纳入版图。"
 annex_north_italy_effect_tt: "吞并所有好感度达到中立以上的北意大利独立小邦"
 annex_sicily_button: "吞并两西西里"
 annex_sicily_button_desc: "两西西里王国是意大利统一的最大障碍。当我们成为唯一的统一候选人时，便可以将其直接纳入版图。"
 annex_sicily_effect_tt: "直接吞并两西西里王国"
 # 萨丁工业化
 je_sardinia_industrialize:0 "萨丁—皮埃蒙特工业化"
 je_sardinia_industrialize_reason:0 "皮埃蒙特地区拥有丰富的自然资源和优越的地理位置，是意大利半岛上最具工业化潜力的地区。我们需要在此建立工业基础，为统一意大利奠定经济根基，届时菲亚特公司也将应运而生。\n\n#bold 若失去皮埃蒙特地区，本日志将自动失效#!"
 sardinia_industrialize_status:0 "皮埃蒙特城镇中心达到5级"
 build_sardinia:0 "新兴的皮埃蒙特"
 industrialized_sardinia:0 "皮埃蒙特工业区"
 sardinia_industry.1.t: "萨丁—皮埃蒙特工业化完成"
 sardinia_industry.1.d: "经过多年的建设，皮埃蒙特地区已经发展成为亚平宁半岛上最发达的工业区。工厂林立，机器轰鸣，萨丁-皮埃蒙特王国的工业实力得到了质的飞跃。随着工业的发展，一家名为菲亚特（Fiat）的汽车制造公司也应运而生，它将成为意大利工业的骄傲。"
 sardinia_industry.1.f: "意大利的工业中心"
 sardinia_industry.1.a: "好极了！"
 sardinia_indu_tt_1: "皮埃蒙特已经成为意大利的工业中心"
 # 红衫军
 red_shirts.1.t: "红衫军出征"
 red_shirts.1.d: "加里波第将军率领他的红衫志愿军从热那亚出发，前往两西西里王国支援当地的统一起义。这支千余人的志愿军将点燃南意大利的革命之火！\n\n民族主义和激进主义思想在两西西里王国迅速蔓延，统一之势已不可阻挡。"
 red_shirts.1.f: "千人远征"
 red_shirts.1.a: "为了意大利的统一！"
 # 阿尔贝特宪法
 je_albertine_statute:0 "阿尔贝特宪法"
 je_albertine_statute_reason:0 "萨丁-皮埃蒙特王国需要一个宪政框架来保障公民权利。我们必须制定一部宪法，以资格性选举制度来规范国家权力。\n\n#bold 若失去皮埃蒙特，本日志将自动失效#!"
 je_albertine_statute_status:0 "通过资格性选举制度"
 sardinia_constitution.1.t: "阿尔贝特宪法"
 sardinia_constitution.1.d: "经过漫长的辩论和协商，阿尔贝特宪法终于正式颁布。这部宪法确立了萨丁-皮埃蒙特王国的宪政体制，资格性选举制度的引入使得知识分子的政治地位得到了空前提升。"
 sardinia_constitution.1.f: "宪政之路"
 sardinia_constitution.1.a: "一个新时代开始了。"
 albertine_statute: "阿尔贝特宪法"
 albertine_statute_desc: "知识分子政治力量 +100%"
 # 罗马问题
 je_roman_question:0 "罗马问题"
 je_roman_question_reason:0 "意大利统一了，但罗马仍在教皇的控制之下。我们必须解决政教关系，通过完全分离法律来收回罗马。\n\n#bold 5年内未完成将导致教会势力大增#!"
 roman_question.1.t: "罗马问题"
 roman_question.1.d: "意大利统一了，然而永恒之城罗马仍被教皇所占据。教廷拒绝承认意大利王国的合法性，而国内围绕教会地位的争论也愈演愈烈。我们必须做出选择：是打压教会的世俗权力，还是与之妥协共存？"
 roman_question.1.f: "罗马之争"
 roman_question.1.a: "打压教会的世俗权力"
 roman_question.1.b: "与教会妥协共存"
 roman_question.2.t: "罗马回归"
 roman_question.2.d: "随着完全分离法律的通过，教廷的世俗权力被彻底剥夺。教皇国正式并入意大利王国，罗马成为了统一意大利的首都。教会被迫接受新的政治现实，转而拥抱罗马式共和的理念。"
 roman_question.2.f: "永恒之城"
 roman_question.2.a: "罗马是意大利的首都！"
 roman_question.3.t: "教会的胜利"
 roman_question.3.d: "我们未能在规定时间内解决罗马问题。教廷利用这段时间巩固了自身的政治地位，迫使政府恢复国教制度。教会的影响力在国内急剧膨胀，成为了不可忽视的政治力量。"
 roman_question.3.f: "教廷的凯旋"
 roman_question.3.a: "这是一个沉重的代价。"
 roman_question_suppress: "打压教会"
 roman_question_suppress_desc: "教会政治力量 -50%"
 roman_question_support: "支持教会"
 roman_question_support_desc: "教会政治力量 +50%"
 roman_question_church_power: "教会掌权"
 roman_question_church_power_desc: "教会政治力量 +100%"